# Publish to Maven Central via the Central Portal, with GPG-signed artifacts.
# Prerequisites: repository must be whitelisted by FOSS admins (foss-help@flipkart.com)
# so these secrets are injected: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_TOKEN,
# FOSS_GPG_KEY, FOSS_GPG_PASSPHRASE.
# Reference pipeline: flipkart-incubator/drift .github/workflows/publish.yml

name: Publish to Maven Central

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      GPG_PASSPHRASE: ${{ secrets.FOSS_GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      # This project targets Java 8 and uses old lombok; keep JDK 8.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          settings-path: ${{ github.workspace }}

      - name: Set up GPG for signing
        run: |
          echo "${{ secrets.FOSS_GPG_KEY }}" | gpg --batch --yes --pinentry-mode loopback --import
          # List secret keys so we can use the only key (or set gpg.keyid in Maven if you have multiple)
          gpg --list-secret-keys --keyid-format=long

      - name: Ensure SNAPSHOT version for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          REVISION=$(python3 <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("pom.xml")
          ns = {"mvn": "http://maven.apache.org/POM/4.0.0"}
          revision = tree.findtext("mvn:properties/mvn:revision", namespaces=ns)
          if revision is None:
              raise SystemExit("Unable to locate <revision> in pom.xml")
          print(revision.strip())
          PY
          )
          echo "Detected revision: ${REVISION}"
          if [[ "${REVISION}" != *SNAPSHOT ]]; then
            echo "Error: workflow_dispatch runs are allowed only for SNAPSHOT revisions."
            exit 1
          fi
          echo "Revision ${REVISION} is a SNAPSHOT; continuing."

      - name: Build with Maven
        run: mvn -B package

      - name: Build and publish to Maven Central (with GPG signing)
        run: mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GPG_PASSPHRASE: ${{ secrets.FOSS_GPG_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.FOSS_GPG_PASSPHRASE }} # Setting both as of now.
